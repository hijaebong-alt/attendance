<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출근부</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#17231f;--sub:#66756f;--line:#dde4e1;--accent:#1f5c4a;--accent-ink:#fff;
--p:#2f8f5b;--l:#d99a1e;--a:#c9483f;--v:#5b7fb8;--pbg:#e0f2e8;--lbg:#fbefd2;--abg:#f8dedb;--vbg:#dde7f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101715;--card:#18221f;--ink:#e8efec;--sub:#8fa19a;--line:#2a3833;--accent:#5fc4a0;--accent-ink:#0c1512;
--pbg:#1d3a2b;--lbg:#403414;--abg:#442522;--vbg:#22324d}}
:root[data-theme="dark"]{--bg:#101715;--card:#18221f;--ink:#e8efec;--sub:#8fa19a;--line:#2a3833;--accent:#5fc4a0;--accent-ink:#0c1512;--pbg:#1d3a2b;--lbg:#403414;--abg:#442522;--vbg:#22324d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:14px 14px 0}
h1{font-size:20px;margin:6px 2px 12px;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}
input,button{font:inherit;color:inherit}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;white-space:nowrap}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.icon{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:18px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar .title{flex:1;text-align:center;font-weight:700;font-size:17px}
.datebar .title small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:9px 0;cursor:pointer;font-weight:500}
.seg button.on[data-s=P]{background:var(--pbg);border-color:var(--p);color:var(--p);font-weight:700}
.seg button.on[data-s=L]{background:var(--lbg);border-color:var(--l);color:var(--l);font-weight:700}
.seg button.on[data-s=A]{background:var(--abg);border-color:var(--a);color:var(--a);font-weight:700}
.seg button.on[data-s=V]{background:var(--vbg);border-color:var(--v);color:var(--v);font-weight:700}
.name{font-weight:700}
.time{font-size:12px;color:var(--sub)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.sum b{display:block;font-size:20px}
.sum span{font-size:12px;color:var(--sub)}
.c-P{color:var(--p)}.c-L{color:var(--l)}.c-A{color:var(--a)}.c-V{color:var(--v)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--p)}
.counts{display:flex;gap:10px;font-size:13px;margin-top:4px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;font-size:12px;min-width:100%}
th,td{padding:6px 0;min-width:26px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);min-width:72px;max-width:72px;text-align:left;padding-left:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--line)}
td.P{background:var(--pbg);color:var(--p)}td.L{background:var(--lbg);color:var(--l)}td.A{background:var(--abg);color:var(--a)}td.V{background:var(--vbg);color:var(--v)}
th.we{color:var(--a)}
.empty{text-align:center;color:var(--sub);padding:28px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 0 9px;color:var(--sub);cursor:pointer;font-size:12px}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--accent);font-weight:700}
.mem{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.del{color:var(--a)}
.hide{display:none}
.banner{font-size:12px;color:var(--sub);margin:-4px 2px 10px}.banner b{color:var(--p)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;z-index:9}
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-tab="att"><span>✓</span>출석</button>
  <button data-tab="sum"><span>▤</span>현황</button>
  <button data-tab="mem"><span>☺</span>회원</button>
</nav>
<script>
const KEY='attendance_v1', S={P:'출근',L:'지각',A:'결근',V:'휴가'}, DOW='일월화수목금토';
const st={members:[],records:{}};
let store=null, mode='load', tab='att', date=ymd(new Date()), month=date.slice(0,7), q=Promise.resolve(), tt;
const $=id=>document.getElementById(id);
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nowT(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function shiftDate(n){const d=parse(date);d.setDate(d.getDate()+n);date=ymd(d);month=date.slice(0,7);render()}
function shiftMonth(n){const[y,m]=month.split('-').map(Number);month=ymd(new Date(y,m-1+n,1)).slice(0,7);render()}
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',4000)}
function errMsg(e){return e&&e.code==='invalid_argument'?'저장 권한이 없습니다. 공유 설정에서 참여자(Contributor) 이상으로 초대해야 합니다.':'저장하지 못했습니다. 잠시 후 다시 시도하세요.'}
function enqueue(fn){q=q.then(fn).catch(e=>toast(errMsg(e)))}
function persist(){if(mode==='local'){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}}
function cell(day,id){const x=(st.records[day]||{})[id];return x&&x.s?x:null}

function writeRec(day,map){
  st.records[day]=Object.assign({},st.records[day]||{},map);persist();render();
  if(mode!=='live')return;
  enqueue(async()=>{const ref=store.doc('days/'+day);
    try{await ref.update({records:map})}catch(e){if(e&&e.code==='invalid_argument')await ref.set({records:map});else throw e}});
}
function mark(id,s){const c=cell(date,id);writeRec(date,{[id]:c&&c.s===s?{s:'',t:''}:{s,t:(s==='P'||s==='L')?nowT():''}})}
function markAll(){const m={};st.members.forEach(x=>{if(!cell(date,x.id))m[x.id]={s:'P',t:nowT()}});if(Object.keys(m).length)writeRec(date,m)}
function addMember(){
  const name=$('nm').value.trim(),note=$('nt').value.trim();if(!name){$('nm').focus();return}
  $('nm').value='';$('nt').value='';
  if(mode==='live'){enqueue(()=>store.collection('members').add({name,note,ts:Date.now()}))}
  else{st.members.push({id:'m'+Date.now().toString(36),name,note,ts:Date.now()});persist();render()}
  $('nm').focus();
}
function delMember(id){
  const m=st.members.find(x=>x.id===id);
  if(!m||!confirm(m.name+' 회원을 삭제할까요? 출석 기록도 현황에서 사라집니다.'))return;
  if(mode==='live'){enqueue(()=>store.doc('members/'+id).delete())}
  st.members=st.members.filter(x=>x.id!==id);persist();render();
}

function viewAtt(){
  const d=parse(date),cnt={P:0,L:0,A:0,V:0};let un=0;
  st.members.forEach(m=>{const c=cell(date,m.id);if(c)cnt[c.s]++;else un++});
  let h=`<h1>일자별 출석</h1><div class="datebar">
  <button class="btn ghost icon" onclick="shiftDate(-1)" aria-label="이전 날">‹</button>
  <div class="title">${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})<small>${d.getFullYear()}${date===ymd(new Date())?' · 오늘':''}</small></div>
  <button class="btn ghost icon" onclick="shiftDate(1)" aria-label="다음 날">›</button></div>
  <div class="row" style="margin-bottom:12px"><input type="date" id="dp" value="${date}" onchange="if(this.value){date=this.value;month=date.slice(0,7);render()}">
  <button class="btn ghost" onclick="date=ymd(new Date());month=date.slice(0,7);render()">오늘</button></div>`;
  if(!st.members.length)return h+`<div class="card empty">등록된 회원이 없습니다.<br>회원 탭에서 먼저 등록하세요.</div>`;
  h+=`<div class="sum">${Object.keys(S).map(k=>`<div><b class="c-${k}">${cnt[k]}</b><span>${S[k]}</span></div>`).join('')}</div>
  <div class="row" style="margin-bottom:10px"><span class="sub grow">미체크 ${un}명</span><button class="btn" onclick="markAll()">미체크 전원 출근</button></div>`;
  st.members.forEach(m=>{
    const x=cell(date,m.id);
    h+=`<div class="card"><div class="row"><div class="grow"><span class="name">${esc(m.name)}</span> <span class="sub">${esc(m.note||'')}</span></div>
    <span class="time">${x&&x.t?x.t:''}</span></div>
    <div class="seg">${Object.keys(S).map(k=>`<button data-s="${k}" class="${x&&x.s===k?'on':''}" onclick="mark('${m.id}','${k}')">${S[k]}</button>`).join('')}</div></div>`;
  });
  return h;
}

function viewSum(){
  const[y,mo]=month.split('-').map(Number),days=new Date(y,mo,0).getDate();
  let h=`<h1>출석 현황</h1><div class="datebar">
  <button class="btn ghost icon" onclick="shiftMonth(-1)" aria-label="이전 달">‹</button>
  <div class="title">${y}년 ${mo}월</div>
  <button class="btn ghost icon" onclick="shiftMonth(1)" aria-label="다음 달">›</button></div>`;
  if(!st.members.length)return h+`<div class="card empty">등록된 회원이 없습니다.</div>`;
  const tot={P:0,L:0,A:0,V:0},rows=[];
  st.members.forEach(m=>{
    const c={P:0,L:0,A:0,V:0};
    for(let d=1;d<=days;d++){const x=cell(month+'-'+String(d).padStart(2,'0'),m.id);if(x){c[x.s]++;tot[x.s]++}}
    rows.push({m,c});
  });
  h+=`<div class="sum">${Object.keys(S).map(k=>`<div><b class="c-${k}">${tot[k]}</b><span>${S[k]} 합계</span></div>`).join('')}</div>`;
  rows.forEach(({m,c})=>{
    const base=c.P+c.L+c.A,rate=base?Math.round((c.P+c.L)/base*100):0;
    h+=`<div class="card"><div class="row"><span class="name grow">${esc(m.name)}</span><b>${base?rate+'%':'-'}</b></div>
    <div class="bar"><i style="width:${rate}%"></i></div>
    <div class="counts">${Object.keys(S).map(k=>`<span class="c-${k}">${S[k]} ${c[k]}</span>`).join('')}</div></div>`;
  });
  h+=`<p class="sub" style="margin:4px 2px 8px">출근율 = (출근+지각) ÷ (출근+지각+결근). 휴가는 제외합니다.</p><div class="scroll"><table><tr><th>이름</th>`;
  for(let d=1;d<=days;d++){const w=new Date(y,mo-1,d).getDay();h+=`<th class="${w===0||w===6?'we':''}">${d}</th>`}
  h+='</tr>';
  rows.forEach(({m})=>{
    h+=`<tr><td>${esc(m.name)}</td>`;
    for(let d=1;d<=days;d++){const x=cell(month+'-'+String(d).padStart(2,'0'),m.id);h+=x?`<td class="${x.s}">${S[x.s][0]}</td>`:'<td></td>'}
    h+='</tr>';
  });
  return h+'</table></div>';
}

function viewMem(){
  let h=`<h1>회원 등록</h1><div class="card"><div class="row" style="margin-bottom:8px"><input id="nm" placeholder="이름" maxlength="20" autocomplete="off" onkeydown="if(event.key==='Enter')$('nt').focus()"></div>
  <div class="row"><input id="nt" placeholder="부서·메모 (선택)" maxlength="30" autocomplete="off" onkeydown="if(event.key==='Enter')addMember()"><button class="btn" onclick="addMember()">등록</button></div></div>
  <div class="sub" style="margin:0 2px 8px">등록 회원 ${st.members.length}명</div>`;
  if(!st.members.length)return h+`<div class="card empty">이름을 입력해 첫 회원을 등록하세요.</div>`;
  h+='<div class="card">';
  st.members.forEach(m=>{h+=`<div class="mem"><div class="grow"><div class="name">${esc(m.name)}</div>${m.note?`<div class="sub">${esc(m.note)}</div>`:''}</div><button class="btn ghost del" onclick="delMember('${m.id}')">삭제</button></div>`});
  return h+'</div>';
}

function render(){
  const a=document.activeElement,fid=a&&a.id,ss=a&&a.selectionStart;
  const keep={nm:$('nm')&&$('nm').value,nt:$('nt')&&$('nt').value};
  const banner=mode==='live'?'<div class="banner"><b>●</b> 공유 중 · 링크를 연 모든 사람과 실시간 동기화</div>'
    :mode==='local'?'<div class="banner">이 기기에만 저장 중 · Claude에 로그인해 열면 공유됩니다</div>':'';
  $('app').innerHTML=mode==='load'?'<div class="empty">연결 중…</div>':banner+(tab==='att'?viewAtt():tab==='sum'?viewSum():viewMem());
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='mem'){if(keep.nm&&$('nm'))$('nm').value=keep.nm;if(keep.nt&&$('nt'))$('nt').value=keep.nt}
  if(fid&&$(fid)&&(fid==='nm'||fid==='nt')){$(fid).focus();try{$(fid).setSelectionRange(ss,ss)}catch(e){}}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
render();

(async()=>{
  let d=null;
  try{if(window.claude&&claude.use)d=await claude.use('db')}catch(e){}
  if(d){
    store=d;mode='live';
    store.collection('members').onSnapshot(snap=>{
      st.members=snap.docs.map(x=>Object.assign({id:x.id},x.data())).sort((a,b)=>(a.ts||0)-(b.ts||0));render();
    },()=>toast('회원 목록을 불러오지 못했습니다.'));
    store.collection('days').onSnapshot(snap=>{
      const r={};snap.docs.forEach(x=>{r[x.id]=(x.data()||{}).records||{}});st.records=r;render();
    },()=>toast('출석 기록을 불러오지 못했습니다.'));
  }else{
    mode='local';
    try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r){st.members=r.members||[];st.records=r.records||{}}}catch(e){}
  }
  render();
})();
</script>
</body>
</html>
